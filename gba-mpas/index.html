<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/HKMPAs_1.js"></script>
        <script src="data/NonHKMPAsNon_HKMPAs_2.js"></script>
        <script src="data/GBA_MPAs_3.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:18, minZoom:3
        })
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
        }
        map.createPane('pane_RRZEOpenStreetMapStandardHD_0');
        map.getPane('pane_RRZEOpenStreetMapStandardHD_0').style.zIndex = 400;
        var layer_RRZEOpenStreetMapStandardHD_0 = L.tileLayer('https://osm.rrze.fau.de/osmhd/{z}/{x}/{y}.png', {
            pane: 'pane_RRZEOpenStreetMapStandardHD_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 3,
            maxZoom: 18,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_RRZEOpenStreetMapStandardHD_0;
        map.addLayer(layer_RRZEOpenStreetMapStandardHD_0);
        function pop_HKMPAs_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Name</th>\
                        <td>' + (feature.properties['Name'] !== null ? autolinker.link(String(feature.properties['Name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_HKMPAs_1_0() {
            return {
                pane: 'pane_HKMPAs_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(114,155,111,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_HKMPAs_1');
        map.getPane('pane_HKMPAs_1').style.zIndex = 401;
        map.getPane('pane_HKMPAs_1').style['mix-blend-mode'] = 'normal';
        var layer_HKMPAs_1 = new L.geoJson(json_HKMPAs_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_HKMPAs_1',
            layerName: 'layer_HKMPAs_1',
            pane: 'pane_HKMPAs_1',
            onEachFeature: pop_HKMPAs_1,
            style: style_HKMPAs_1_0,
        });
        bounds_group.addLayer(layer_HKMPAs_1);
        map.addLayer(layer_HKMPAs_1);

            var content = removeEmptyRowsFromPopupContent(popupContent, feature);

        function style_NonHKMPAsNon_HKMPAs_2_0(feature) {
            switch(String(feature.properties['Level'])) {

                    break;
                case 'National':

                case 'Provincial':

                fillColor: 'rgba(211,32,32,1.0)',
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_NonHKMPAsNon_HKMPAs_2',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(103,0,13,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_NonHKMPAsNon_HKMPAs_2');
        map.getPane('pane_NonHKMPAsNon_HKMPAs_2').style.zIndex = 402;
        map.getPane('pane_NonHKMPAsNon_HKMPAs_2').style['mix-blend-mode'] = 'normal';
        var layer_NonHKMPAsNon_HKMPAs_2 = new L.geoJson(json_NonHKMPAsNon_HKMPAs_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_NonHKMPAsNon_HKMPAs_2',
            layerName: 'layer_NonHKMPAsNon_HKMPAs_2',
            pane: 'pane_NonHKMPAsNon_HKMPAs_2',
            onEachFeature: pop_NonHKMPAsNon_HKMPAs_2,
            style: style_NonHKMPAsNon_HKMPAs_2_0,
        });
        bounds_group.addLayer(layer_NonHKMPAsNon_HKMPAs_2);
        map.addLayer(layer_NonHKMPAsNon_HKMPAs_2);
        function pop_GBA_MPAs_3(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">Name</th>\
                        <td>' + (feature.properties['Name'] !== null ? autolinker.link(String(feature.properties['Name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Level</th>\
                        <td class="visible-with-data" id="Level">' + (feature.properties['Level'] !== null ? autolinker.link(String(feature.properties['Level']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\

                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {

			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_GBA_MPAs_3_0(feature) {
            switch(String(feature.properties['Level'])) {
                case 'Country':
                    return {

                    break;
                case 'Municipal':

            }
                    break;
                case 'National':
                    return {
                pane: 'pane_GBA_MPAs_3',
                opacity: 1,

                dashArray: '',

            }
                    break;
                case 'Provincial':
                    return {

                opacity: 1,

                dashArray: '',

                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(171,221,164,1.0)',
                interactive: true,
            }
                    break;
                default:
                    return {
                pane: 'pane_GBA_MPAs_3',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(43,131,186,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_GBA_MPAs_3');
        map.getPane('pane_GBA_MPAs_3').style.zIndex = 403;
        map.getPane('pane_GBA_MPAs_3').style['mix-blend-mode'] = 'normal';
        var layer_GBA_MPAs_3 = new L.geoJson(json_GBA_MPAs_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_GBA_MPAs_3',
            layerName: 'layer_GBA_MPAs_3',
            pane: 'pane_GBA_MPAs_3',
            onEachFeature: pop_GBA_MPAs_3,
            style: style_GBA_MPAs_3_0,
        });
        bounds_group.addLayer(layer_GBA_MPAs_3);
        map.addLayer(layer_GBA_MPAs_3);
        setBounds();
        </script>        
    </body>
</html>
